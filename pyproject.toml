[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitshield"
version = "1.0.0"
description = "AI-powered Git Guardian — prevents secret leaks, enforces best practices, and coaches developers in real-time"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GitShield Team"}
]
keywords = ["git", "security", "developer-tools", "ai", "cli", "secrets", "guardian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "colorama>=0.4.6",
]

[project.scripts]
gitshield = "devflow.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/gitshield"
Repository = "https://github.com/your-username/gitshield"
Issues = "https://github.com/your-username/gitshield/issues"

[tool.setuptools.packages.find]
include = ["devflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
