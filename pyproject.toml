[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitshield"
dynamic = ["version"]
description = "AI-powered Git Guardian — prevents secret leaks, enforces best practices, and coaches developers in real-time"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GitShield Team"}
]
keywords = ["git", "security", "developer-tools", "ai", "cli", "secrets", "guardian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "colorama>=0.4.6",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
gitshield = "devflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
# TODO: Replace these placeholder URLs before publishing!
# If left as-is, they will fail loudly or point to a non-existent repo.
Homepage = "https://github.com/kamrankausher/GitShield"
Repository = "https://github.com/kamrankausher/GitShield"
Issues = "https://github.com/kamrankausher/GitShield/issues"

[tool.setuptools.packages.find]
include = ["devflow*"]

[tool.setuptools.dynamic]
version = {attr = "devflow.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []
